name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Smoke test
        run: |
          npm start &
          for i in $(seq 1 20); do curl -fsS http://localhost:8888/healthz && break; sleep 1; done
          curl -fsS http://localhost:8888/ | grep -q '<div id="root">'
